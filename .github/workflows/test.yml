name: Test

# Runs on every push and pull request. The deploy workflow builds and ships
# whatever is on main, so this is the gate that says whether it should have.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        # Both projects, and a real failure. app/ and worker/ need different
        # globals -- DOM vs Cloudflare -- so they are separate tsconfigs; this
        # step used to swallow every error outside app/ behind `|| true`, which
        # hid a wrong Playwright option and an undeclared D1 binding.
        run: npm run types

      - name: Static build
        # Two tests read static-dist/index.html to check what the solo build
        # renders. A local checkout usually has one lying around; a fresh
        # runner does not, so build it here.
        run: npm run build:static

      - name: Browser end-to-end
        # The rigs above all talk to the engine. This one drives the built page
        # in a real browser, which is the only place a modal that swallows a
        # click, a button that never mounts, or a number the engine computed and
        # the DOM never showed can be seen. It runs against static-dist, which
        # the step above already built, so it costs no extra build.
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=pages-static

      - name: Browser end-to-end (online)
        # This one boots wrangler and the Durable Objects, which no other CI step
        # does, and its stability on a hosted runner is unverified. It is allowed
        # to fail so a flaky runtime cannot block the deploy the way a real
        # regression should. Promote it to blocking once it has a track record.
        continue-on-error: true
        run: npx playwright test --project=online

      - name: E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Tests
        run: npm test

      - name: Playtest
        # Drives the engine through complete games; a rule that crashes or
        # breaks an invariant fails here even when no unit test covers it.
        run: |
          node scripts/playtest.mjs --games=20 --players=1
          node scripts/playtest.mjs --games=20 --players=2 --prelude --venus --colonies --turmoil --promo
          # Drafting replaces the dealt hand with a pass-and-pick round, so it
          # is a different setup path and was never exercised here.
          node scripts/playtest.mjs --games=10 --players=3 --draft --prelude --venus --colonies --turmoil --promo

      - name: Unread card flags
        # A curated `effects` key with no reader in app/ is a rule the cards
        # promise and the engine never performs. Vitor's free award and Valley
        # Trust's free prelude both sat there unnoticed while every test passed.
        run: node scripts/audit-unread-flags.mjs

      - name: Inert cards
        # Cards whose text promises an effect the engine cannot perform. This is
        # the gap coverage cannot see: a trigger card correctly changes nothing
        # when played, and a card that only takes your money changes the state by
        # taking it. A ratchet, not a gate -- the count must not grow.
        run: node scripts/audit-inert-cards.mjs

      - name: Card contracts
        # Coverage asks whether a card changed the state; this asks whether it
        # changed the right number by the right amount. A card whose spec says
        # "M€ production +3" and pays 4 fails here.
        run: node scripts/audit-card-contracts.mjs

      - name: Coverage report
        # Prints what the audits below actually verify and what they do not, so
        # a run of green ticks is not mistaken for "every card is correct".
        run: node scripts/audit-coverage-report.mjs

      - name: Card actions
        # A blue card's action happens through its own command, so the contract
        # audit above never sees it. This checks every branch of every action
        # takes what it says and gives what it says.
        run: node scripts/audit-card-actions.mjs

      - name: Ongoing effects
        # An ongoing effect changes nothing when played -- it changes what
        # happens later -- so it is observed where it applies: a discount at the
        # price of the card it discounts, a trade concession at a trade, a
        # watcher at the next card played.
        run: node scripts/audit-ongoing-effects.mjs

      - name: Card scoring
        # A scoring card does nothing when played and everything at the end, so
        # a scorer that rounds the wrong way or reads the wrong owner's pile is
        # invisible until someone counts by hand. Every card is measured at 0,
        # per-1, per and per+1 of whatever it counts.
        run: node scripts/audit-card-scoring.mjs

      - name: Playability against upstream
        # The reference implementation's own tests, run against our engine. A
        # requirement can be transcribed perfectly and still read wrongly, and
        # only playing the exact board its authors chose says which. Seven cases
        # are a known baseline; more is a regression.
        run: node scripts/audit-playable-against-upstream.mjs

      - name: Card actions against upstream
        # The other half of the playability audit: a blue card's action happens
        # later, and a card whose action can never be taken is exactly the shape
        # of the cards that shipped inert. 70 of the reference's own cases.
        run: node scripts/audit-actions-against-upstream.mjs

      - name: Victory point cases against upstream
        # What the card's own authors say it is worth, on the boards they chose.
        # The spec comparison checks the declaration and the boundary sweep
        # checks the arithmetic; this checks the answer.
        run: node scripts/audit-vp-cases-against-upstream.mjs

      - name: Declared behaviour against upstream
        # A card can print the right cost, pass every test anyone wrote about
        # it, and still declare an effect that differs in a key nobody tested.
        run: node scripts/audit-behavior-against-upstream.mjs

      - name: Card operations against upstream
        # Every other upstream audit stages the card itself: a fresh game, one
        # call, one situation this repository chose. This one replays 2,862
        # operations recorded while the reference's own suite ran green -- its
        # boards, its tags, its opponents -- and 267 are reproducible here
        # closely enough to compare field by field. Breaking flat production by
        # one step turns 34 of them red, which is what makes the zero mean
        # something. The rest are named by why they cannot be staged, never
        # dropped quietly.
        run: node scripts/audit-upstream-differential.mjs

      - name: Skip ledger
        # Read one at a time each oracle's skips look small; together they are
        # 335 upstream blocks across 210 cards, plus 245 cards no oracle
        # mentions at all. Every one of them must be owned by something else.
        run: node scripts/audit-skip-ledger.mjs

      - name: Unsupported card isolation
        # Six cards we have not implemented. Three still reach a player, which
        # is a product decision to make deliberately rather than a bug to slip
        # in; the audit holds that number and fails if a listed card starts
        # working, so the register cannot go stale.
        run: node scripts/audit-unsupported-isolation.mjs

      - name: Bespoke method inventory
        # 174 cards whose behaviour upstream writes by hand -- the shape the
        # catalogue generator cannot copy, and where nineteen dead cards have
        # come from. A card given an action upstream must have one here, or say
        # what it would take.
        run: node scripts/audit-bespoke-inventory.mjs

      - name: Cards with no upstream oracle
        # Seven cards the reference ships no test file for, so all three upstream
        # oracles are blind to them. Each must name the local test that owns it.
        run: node scripts/audit-unspecced-cards.mjs

      - name: Empty spec registry
        # A card whose catalogue entry promises nothing passes every other audit
        # while doing nothing at all. This makes each one say by name why it has
        # no spec, so a new one -- or a card that loses its spec -- fails here.
        run: node scripts/audit-empty-spec-registry.mjs

      - name: Cards against upstream
        # Cost, tags, requirements, type and resource type compared with the
        # real cards. Nine preludes carried the wrong tags and Frontier Town was
        # free instead of 11 M€, and every other audit passed all ten.
        run: node scripts/audit-cards-against-upstream.mjs

      - name: Victory points against upstream
        # Every other audit asks whether the engine honours our catalogue. This
        # asks whether the catalogue is right: a spec saying two points per
        # resource where the card says three is honoured perfectly and still
        # loses the game. Compared against a pinned manifest, not the network.
        run: node scripts/audit-vp-against-upstream.mjs

      - name: Card coverage
        # Plays every card in the catalogue and fails if any produces no
        # observable change, so a card cannot go inert unnoticed.
        run: node scripts/card-coverage.mjs

      - name: Playtest every map
        run: |
          for map in tharsis hellas elysium utopia amazonis; do
            node scripts/playtest.mjs --games=10 --players=2 --board=$map
          done
